<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<link rel="stylesheet" href="bubble.css" />
</head>
<body>
  <button id="paw" title="Ask Loon about this" aria-label="Ask Loon about this selection"><svg viewBox="0 0 40 40"><g fill="currentColor"><ellipse cx="20" cy="26" rx="9" ry="7.5"/><ellipse cx="9.5" cy="15.5" rx="3.6" ry="4.6"/><ellipse cx="17" cy="9.5" rx="3.6" ry="4.8"/><ellipse cx="25.5" cy="10.5" rx="3.6" ry="4.6"/><ellipse cx="31.5" cy="18" rx="3.2" ry="4.2"/></g></svg></button>
  <div id="card">
    <header>
      <svg class="face" viewBox="0.5 -0.5 7 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2e2733" d="M1 0h1v1h1v1h2V1h1V0h1v6H6v1H2V6H1z"/><path fill="#ff8fb8" d="M1 1h1v1H1zM6 1h1v1H6zM1.5 4.5h1v.5h-1zM5.5 4.5h1v.5h-1z"/><path fill="#80e27e" d="M2 3h1v1H2zM5 3h1v1H5z"/></svg>
      <span class="title">Loon</span>
      <span id="sourceLabel" class="source"></span>
      <button id="close" title="Close (Esc)" aria-label="Close">×</button>
    </header>

    <p id="redacted" hidden></p>
    <div id="chips" role="toolbar" aria-label="What should I do?"></div>
    <p id="notice" hidden></p>

    <section id="sensitive" hidden>
      <p>🔒 Private page. I looked away and didn't read anything.</p>
      <button id="lookAnyway" class="secondary">Look anyway, just this once</button>
    </section>

    <section id="setup" hidden>
      <p id="setupText"></p>
      <button id="download" class="primary"></button>
      <div id="progress" hidden><div id="bar"></div></div>
      <p id="progressText" class="muted"></p>
    </section>

    <section id="log" aria-live="polite"></section>
    <section id="empty" hidden>
      <p id="greeting" class="flavor" hidden></p>
      <div id="suggestions"></div>
      <p class="hint">⌥⇧V talk · ⌥⇧S screenshot · drop a file on me</p>
    </section>

    <form id="askForm">
      <textarea id="input" rows="1" placeholder="Ask me anything…" aria-label="Ask Loon"></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </form>


  </div>
  <script src="lib/grade.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
