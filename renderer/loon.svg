<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 256" id="loon" overflow="visible">
  <!--
    Loon puppet. Every animated part is a group with an id; cat.js moves parts by id,
    so shapes can be redrawn in Inkscape freely as long as the ids and pivots stay.
    Pivots (transform-origin) are set in cat.js next to each part.
  -->
  <defs>
    <radialGradient id="iris" cx="50%" cy="72%" r="70%">
      <stop offset="0%" stop-color="#c9f59a"/>
      <stop offset="45%" stop-color="#8fdc5a"/>
      <stop offset="100%" stop-color="#3f8f2c"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" stop-color="#e9ffd9" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#a9e58a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a9e58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f3f6"/>
      <stop offset="100%" stop-color="#9ea4ad"/>
    </linearGradient>
    <clipPath id="eyeClip"><circle r="20"/></clipPath>
    <!-- white sticker border + soft drop shadow around the whole silhouette -->
    <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5.5" result="grown"/>
      <feFlood flood-color="#fbfaf5"/>
      <feComposite in2="grown" operator="in" result="border"/>
      <feGaussianBlur in="grown" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dy="2.5" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.28"/>
      <feComposite in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="cat">
    <g id="silhouette" filter="url(#sticker)">

      <!-- tail: pivot at its base (158,226) -->
      <g id="tail">
        <path id="tailUp" d="M152 228 C186 232 206 206 196 178 C188 156 186 138 204 128"
              fill="none" stroke="#141216" stroke-width="16" stroke-linecap="round"/>
        <path id="tailWrap" d="M150 234 C176 240 190 226 178 216 M150 234 C120 246 78 246 60 236"
              fill="none" stroke="#141216" stroke-width="15" stroke-linecap="round" display="none"/>
      </g>

      <!-- body: pivot at ground centre (110,238) -->
      <g id="body">
        <g id="bodySit">
          <ellipse cx="146" cy="212" rx="23" ry="26" fill="#141216"/>
          <path d="M82 124 C70 150 58 184 60 212 C61 230 74 239 92 239 L140 239 C156 239 166 230 165 214 C162 180 150 150 138 124 Z" fill="#141216"/>
          <!-- chest fluff -->
          <path d="M86 130 L92 150 L98 140 L104 156 L110 142 L116 156 L122 140 L128 150 L134 130 Z" fill="#141216"/>
          <g fill="none" stroke="#2c2932" stroke-width="2" stroke-linecap="round">
            <path d="M97 148 L101 158"/><path d="M110 150 L110 162"/><path d="M123 148 L119 158"/>
            <path d="M109 176 C108 200 108 222 107 236"/>
            <path d="M152 196 C158 206 159 218 154 230"/>
          </g>
          <g id="pawsDown">
            <ellipse cx="94" cy="236" rx="15" ry="8.5" fill="#141216"/>
            <ellipse cx="124" cy="236" rx="15" ry="8.5" fill="#141216"/>
            <g stroke="#2c2932" stroke-width="1.8" stroke-linecap="round">
              <path d="M90 233 L90 240"/><path d="M98 233 L98 240"/>
              <path d="M120 233 L120 240"/><path d="M128 233 L128 240"/>
            </g>
          </g>
        </g>
        <g id="bodyLoaf" display="none">
          <ellipse cx="112" cy="211" rx="64" ry="33" fill="#141216"/>
          <path d="M72 200 C88 190 138 190 154 200" fill="none" stroke="#2c2932" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- collar + moon pendant: pivot follows the neck -->
        <g id="collar">
          <path d="M84 127 Q110 141 136 127" fill="none" stroke="url(#silver)" stroke-width="2.8" stroke-linecap="round"/>
          <g id="pendant" transform="translate(110 142)">
            <circle id="moonGlowDisc" r="15" fill="url(#moonGlow)" opacity="0"/>
            <circle cx="0" cy="-6" r="2" fill="none" stroke="#c8ccd2" stroke-width="1.4"/>
            <circle r="6.8" fill="url(#silver)" stroke="#8e949c" stroke-width="0.8"/>
            <circle r="4.3" fill="#26282e"/>
            <circle cx="2" cy="-1.3" r="3.8" fill="#dfe2e6"/>
          </g>
        </g>
      </g>

      <!-- head: pivot at the neck (110,126) -->
      <g id="head">
        <g id="earL">
          <path d="M60 72 L55 18 Q56 9 64 13 L102 44 Z" fill="#141216"/>
          <path d="M66 62 L62 26 L93 47 Z" fill="#3b312d"/>
          <g stroke="#6b5f59" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
            <path d="M66 58 L72 48"/><path d="M69 61 L76 53"/>
          </g>
        </g>
        <g id="earR">
          <path d="M160 72 L165 18 Q164 9 156 13 L118 44 Z" fill="#141216"/>
          <path d="M154 62 L158 26 L127 47 Z" fill="#3b312d"/>
          <g stroke="#6b5f59" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
            <path d="M154 58 L148 48"/><path d="M151 61 L144 53"/>
          </g>
        </g>
        <path id="headShape" fill="#141216"
              d="M110 36 C146 36 168 58 170 82 L180 90 L169 95 L176 105 L163 106 C152 122 133 130 110 130 C87 130 68 122 57 106 L44 105 L51 95 L40 90 L50 82 C52 58 74 36 110 36 Z"/>
        <path d="M99 41 L104 27 L110 39 L115 25 L121 41 Z" fill="#141216"/>
        <path d="M86 46 C98 40 122 40 134 46" fill="none" stroke="#2c2932" stroke-width="2" stroke-linecap="round"/>

        <!-- eyes: each at its own origin so lids/pupils use local coords -->
        <g id="eyeL" transform="translate(86 87)">
          <g class="eyeOpen" clip-path="url(#eyeClip)">
            <circle r="20" fill="#1d3616"/>
            <circle r="18" fill="url(#iris)"/>
            <g class="pupil">
              <circle r="11" fill="#0a0c08"/>
              <circle cx="-5.5" cy="-6.5" r="4.8" fill="#fff"/>
              <circle cx="5.5" cy="5.5" r="2.2" fill="#fff" opacity="0.9"/>
            </g>
            <rect class="lid" x="-32" y="-72" width="64" height="52" fill="#141216"/>
            <rect class="lidLow" x="-32" y="20" width="64" height="40" fill="#141216"/>
          </g>
          <path class="lash" d="M-15 2 Q0 10 15 2" fill="none" stroke="#5d5764" stroke-width="2.6" stroke-linecap="round" opacity="0"/>
          <path class="happy" d="M-14 6 Q0 -11 14 6" fill="none" stroke="#8a8494" stroke-width="3" stroke-linecap="round" opacity="0"/>
        </g>
        <g id="eyeR" transform="translate(134 87)">
          <g class="eyeOpen" clip-path="url(#eyeClip)">
            <circle r="20" fill="#1d3616"/>
            <circle r="18" fill="url(#iris)"/>
            <g class="pupil">
              <circle r="11" fill="#0a0c08"/>
              <circle cx="-5.5" cy="-6.5" r="4.8" fill="#fff"/>
              <circle cx="5.5" cy="5.5" r="2.2" fill="#fff" opacity="0.9"/>
            </g>
            <rect class="lid" x="-32" y="-72" width="64" height="52" fill="#141216"/>
            <rect class="lidLow" x="-32" y="20" width="64" height="40" fill="#141216"/>
          </g>
          <path class="lash" d="M-15 2 Q0 10 15 2" fill="none" stroke="#5d5764" stroke-width="2.6" stroke-linecap="round" opacity="0"/>
          <path class="happy" d="M-14 6 Q0 -11 14 6" fill="none" stroke="#8a8494" stroke-width="3" stroke-linecap="round" opacity="0"/>
        </g>

        <path d="M105 101 Q110 99.5 115 101 Q113 105.5 110 107 Q107 105.5 105 101 Z" fill="#3a2f33"/>
        <path id="mouthSmile" d="M101 110 Q105.5 116 110 110.5 Q114.5 116 119 110" fill="none" stroke="#56505c" stroke-width="2" stroke-linecap="round"/>
        <path id="mouthFlat" d="M103 112 L117 112" fill="none" stroke="#56505c" stroke-width="2" stroke-linecap="round" display="none"/>
        <g id="mouthOpen" display="none">
          <ellipse cx="110" cy="114" rx="5.5" ry="6.5" fill="#241519"/>
          <ellipse cx="110" cy="117.5" rx="3.5" ry="2.4" fill="#e3899f"/>
        </g>

        <g id="pawsUp" display="none">
          <path d="M92 150 C82 128 82 112 86 100" fill="none" stroke="#141216" stroke-width="18" stroke-linecap="round"/>
          <path d="M128 150 C138 128 138 112 134 100" fill="none" stroke="#141216" stroke-width="18" stroke-linecap="round"/>
          <ellipse cx="86" cy="86" rx="23" ry="20" fill="#141216" stroke="#3a3540" stroke-width="2.2"/>
          <ellipse cx="134" cy="86" rx="23" ry="20" fill="#141216" stroke="#3a3540" stroke-width="2.2"/>
          <g stroke="#3a3540" stroke-width="2" stroke-linecap="round">
            <path d="M78 72 L77 80"/><path d="M86 70 L86 78"/><path d="M94 72 L95 80"/>
            <path d="M126 72 L125 80"/><path d="M134 70 L134 78"/><path d="M142 72 L143 80"/>
          </g>
        </g>
      </g>
    </g>

    <!-- whiskers sit outside the sticker filter so they stay thin; cat.js mirrors the head transform onto them -->
    <g id="whiskers" fill="none" stroke="#dcdce2" stroke-width="1.3" stroke-linecap="round" opacity="0.85">
      <path d="M72 103 L32 96"/><path d="M71 108 L30 109"/><path d="M73 112 L36 122"/>
      <path d="M148 103 L188 96"/><path d="M149 108 L190 109"/><path d="M147 112 L184 122"/>
    </g>
  </g>
</svg>
